services:
  proxy:
    build: .
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
    # Mount host source code to container -> Code changes reflected quickly (Node restart required)
    volumes:
      - ./proxy-server:/app/proxy-server
      - ./chrome-kakucyo:/app/chrome-kakucyo
      - ./guide-package.schema.json:/app/guide-package.schema.json:ro
      - ./guides:/app/guides:ro
      # Use the container's node_modules (do not overwrite with host's)
      - /app/proxy-server/node_modules
